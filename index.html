<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南阳技师学院 · 班主任工作台</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js" integrity="sha384-pPi0zxBAoDu6+JXW/C68UZLvBUUtU+7zonhif43rqj7pxsGyqyqzcian2Rj37Rss" crossorigin="anonymous"></script>
<style>
/* ===== 全局变量与重置 ===== */
:root {
  --bg: #FDF8F3;
  --bg-warm: #FAF0E6;
  --card: #FFFFFF;
  --primary: #D4786B;
  --primary-light: #E8A598;
  --primary-lighter: #F5DDD8;
  --accent: #E8C87A;
  --accent-light: #F5E6C8;
  --text: #4A3F35;
  --text-light: #8B7E74;
  --text-lighter: #B5A99E;
  --border: #EDE0D4;
  --success: #7BA05B;
  --warning: #E8A838;
  --danger: #C75B5B;
  --radius: 14px;
  --radius-sm: 8px;
  --shadow: 0 2px 12px rgba(74, 63, 53, 0.07);
  --shadow-hover: 0 8px 24px rgba(74, 63, 53, 0.13);
  --sidebar-w: 224px;
  --sidebar-collapse: 60px;
  --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  overflow: hidden;
}
h1, h2, h3, h4 { font-family: 'Noto Serif SC', serif; font-weight: 700; }
button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
input, select, textarea { font-family: inherit; font-size: 14px; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-lighter); }

/* ===== 布局 ===== */
.app { display: flex; height: 100vh; width: 100%; }

/* ===== 侧边栏 ===== */
.sidebar {
  width: var(--sidebar-w);
  background: linear-gradient(180deg, #FFF9F2 0%, #FDF0E8 100%);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  flex-shrink: 0;
  position: relative;
  z-index: 100;
}
.sidebar.collapsed { width: var(--sidebar-collapse); }
.sidebar-header {
  padding: 20px 16px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 72px;
}
.sidebar-logo {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  color: #fff; font-family: 'Noto Serif SC', serif; font-weight: 900; font-size: 16px;
}
.sidebar-title { overflow: hidden; white-space: nowrap; }
.sidebar-title h2 { font-size: 15px; color: var(--text); margin-bottom: 2px; }
.sidebar-title p { font-size: 11px; color: var(--text-light); }
.sidebar.collapsed .sidebar-title { display: none; }

.sidebar-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
.nav-group-label {
  font-size: 11px; color: var(--text-lighter); padding: 8px 12px 4px;
  text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; overflow: hidden;
}
.sidebar.collapsed .nav-group-label { display: none; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  color: var(--text-light); font-size: 13.5px; font-weight: 500;
  transition: var(--transition); margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; position: relative;
}
.nav-item:hover { background: var(--primary-lighter); color: var(--primary); }
.nav-item.active {
  background: linear-gradient(135deg, var(--primary-lighter) 0%, var(--accent-light) 100%);
  color: var(--primary); font-weight: 700;
}
.nav-item.active::before {
  content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 20px; background: var(--primary); border-radius: 0 3px 3px 0;
}
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar.collapsed .nav-item span { display: none; }
.sidebar.collapsed .nav-item { justify-content: center; padding: 10px; }

.sidebar-footer {
  padding: 12px; border-top: 1px solid var(--border);
}
.collapse-btn {
  width: 100%; padding: 8px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center; gap: 6px;
  color: var(--text-light); font-size: 12px; transition: var(--transition);
}
.collapse-btn:hover { background: var(--primary-lighter); color: var(--primary); }
.collapse-btn svg { width: 16px; height: 16px; transition: transform 0.3s; }
.sidebar.collapsed .collapse-btn svg { transform: rotate(180deg); }
.sidebar.collapsed .collapse-btn span { display: none; }

/* ===== 主内容区 ===== */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.topbar {
  height: 60px; background: var(--card); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; flex-shrink: 0;
}
.topbar-left { display: flex; align-items: center; gap: 16px; }
.topbar h1 { font-size: 18px; color: var(--text); }
.topbar .breadcrumb { font-size: 12px; color: var(--text-light); }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.topbar-btn {
  padding: 7px 14px; border-radius: var(--radius-sm); font-size: 12.5px;
  display: flex; align-items: center; gap: 6px; transition: var(--transition);
  border: 1px solid var(--border); background: var(--card); color: var(--text-light);
}
.topbar-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-lighter); }
.topbar-btn svg { width: 14px; height: 14px; }
.topbar-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.topbar-btn.primary:hover { background: #C46659; }

.content { flex: 1; overflow-y: auto; padding: 24px; }
.view { display: none; animation: fadeIn 0.3s ease; }
.view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ===== 通用卡片 ===== */
.card {
  background: var(--card); border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow); border: 1px solid rgba(237, 224, 212, 0.5);
  transition: var(--transition);
}
.card:hover { box-shadow: var(--shadow-hover); }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.card-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card-title .tag {
  font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500;
  background: var(--accent-light); color: #9A7B2E;
}

/* ===== 按钮 ===== */
.btn {
  padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; transition: var(--transition);
  border: 1px solid transparent;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: #C46659; transform: translateY(-1px); }
.btn-outline { background: var(--card); border-color: var(--border); color: var(--text-light); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-accent { background: var(--accent-light); color: #9A7B2E; }
.btn-accent:hover { background: var(--accent); color: #fff; }
.btn-danger { background: #FBE5E5; color: var(--danger); }
.btn-danger:hover { background: var(--danger); color: #fff; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn svg { width: 14px; height: 14px; }

/* ===== 表单 ===== */
.form-group { margin-bottom: 14px; }
.form-label { display: block; font-size: 12.5px; color: var(--text-light); margin-bottom: 5px; font-weight: 500; }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg); color: var(--text); transition: var(--transition); outline: none;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--primary); box-shadow: 0 0 0 3px rgba(212, 120, 107, 0.12); background: #fff;
}
.form-textarea { resize: vertical; min-height: 70px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ===== 模态框 ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(74, 63, 53, 0.4);
  display: none; align-items: center; justify-content: center; z-index: 1000;
  backdrop-filter: blur(2px);
}
.modal-overlay.show { display: flex; animation: fadeIn 0.2s ease; }
.modal {
  background: var(--card); border-radius: var(--radius); width: 90%; max-width: 560px;
  max-height: 85vh; display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 20px 60px rgba(74, 63, 53, 0.2);
  animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal-header {
  padding: 18px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-header h3 { font-size: 17px; }
.modal-close { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-light); transition: var(--transition); }
.modal-close:hover { background: var(--primary-lighter); color: var(--primary); }
.modal-close svg { width: 18px; height: 18px; }
.modal-body { padding: 24px; overflow-y: auto; flex: 1; }
.modal-footer { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

/* ===== Toast ===== */
.toast-container { position: fixed; top: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 12px 20px; border-radius: var(--radius-sm); background: var(--card);
  box-shadow: 0 4px 16px rgba(74, 63, 53, 0.15); display: flex; align-items: center; gap: 8px;
  font-size: 13px; animation: toastIn 0.3s ease; border-left: 3px solid var(--success);
}
.toast.error { border-left-color: var(--danger); }
.toast.warning { border-left-color: var(--warning); }
@keyframes toastIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
.toast.out { animation: toastOut 0.3s ease forwards; }
@keyframes toastOut { to { opacity: 0; transform: translateX(30px); } }

/* ===== 工作台首页 ===== */
.welcome-banner {
  background: linear-gradient(135deg, #FFF5EE 0%, #FDEEE0 50%, #FDF6E3 100%);
  border-radius: var(--radius); padding: 28px 32px; margin-bottom: 24px;
  display: flex; align-items: center; justify-content: space-between;
  border: 1px solid rgba(232, 168, 122, 0.2); position: relative; overflow: hidden;
}
.welcome-banner::after {
  content: ''; position: absolute; right: -30px; top: -30px; width: 160px; height: 160px;
  background: radial-gradient(circle, rgba(232, 200, 122, 0.2) 0%, transparent 70%);
  border-radius: 50%;
}
.welcome-info h2 { font-size: 22px; margin-bottom: 6px; color: var(--text); }
.welcome-info p { color: var(--text-light); font-size: 13px; }
.welcome-stats { display: flex; gap: 32px; position: relative; z-index: 1; }
.welcome-stat { text-align: center; }
.welcome-stat .num { font-size: 28px; font-weight: 900; font-family: 'Noto Serif SC', serif; color: var(--primary); }
.welcome-stat .label { font-size: 12px; color: var(--text-light); margin-top: 2px; }

.work-section { margin-bottom: 24px; }
.work-section-title {
  font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
  padding-left: 10px; border-left: 3px solid var(--primary);
}
.work-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.work-card {
  background: var(--card); border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow); cursor: pointer; transition: var(--transition);
  border: 1px solid rgba(237, 224, 212, 0.5); position: relative; overflow: hidden;
}
.work-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
  transform: scaleX(0); transform-origin: left; transition: transform 0.3s ease;
}
.work-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
.work-card:hover::before { transform: scaleX(1); }
.work-card-icon {
  width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  margin-bottom: 14px;
}
.work-card-icon svg { width: 22px; height: 22px; }
.work-card h4 { font-size: 15px; margin-bottom: 6px; }
.work-card p { font-size: 12.5px; color: var(--text-light); line-height: 1.5; }
.work-card .status {
  display: inline-block; margin-top: 10px; font-size: 11px; padding: 3px 10px;
  border-radius: 20px; background: var(--accent-light); color: #9A7B2E;
}

/* ===== 座次表 ===== */
.seat-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.search-box {
  position: relative; flex: 1; max-width: 280px;
}
.search-box input {
  width: 100%; padding: 9px 12px 9px 36px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: var(--card); outline: none; transition: var(--transition);
}
.search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(212,120,107,0.1); }
.search-box svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-lighter); }
.group-filters { display: flex; gap: 6px; flex-wrap: wrap; }
.group-filter-btn {
  padding: 5px 12px; border-radius: 20px; font-size: 12px; border: 1px solid var(--border);
  background: var(--card); color: var(--text-light); transition: var(--transition);
}
.group-filter-btn:hover { border-color: var(--primary); color: var(--primary); }
.group-filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

.classroom {
  background: var(--card); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow);
}
.teacher-desk {
  width: 200px; margin: 0 auto 24px; padding: 12px; text-align: center;
  background: linear-gradient(135deg, var(--primary-lighter), var(--accent-light));
  border-radius: var(--radius-sm); font-weight: 700; font-size: 13px; color: var(--text);
  border: 2px dashed var(--primary-light);
}
.seat-grid {
  display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; max-width: 800px; margin: 0 auto;
}
.seat {
  aspect-ratio: 1; border-radius: var(--radius-sm); display: flex; flex-direction: column;
  align-items: center; justify-content: center; cursor: pointer; transition: var(--transition);
  border: 2px solid transparent; position: relative; font-size: 12px; text-align: center; padding: 4px;
}
.seat.occupied { background: var(--bg-warm); border-color: var(--border); }
.seat.occupied:hover { border-color: var(--primary); transform: scale(1.05); box-shadow: var(--shadow); }
.seat.empty { background: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(0,0,0,0.02) 5px, rgba(0,0,0,0.02) 10px); border: 2px dashed var(--border); }
.seat .seat-name { font-weight: 600; font-size: 12.5px; line-height: 1.2; }
.seat .seat-group {
  position: absolute; top: 3px; right: 4px; font-size: 9px; padding: 1px 5px;
  border-radius: 8px; font-weight: 700;
}
.seat.highlight { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(212,120,107,0.2); transform: scale(1.05); }
.seat.drag-over { border-color: var(--accent); background: var(--accent-light); }
.seat.dragging { opacity: 0.4; }

/* ===== 值日表 ===== */
.duty-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
.week-selector { display: flex; align-items: center; gap: 8px; }
.week-selector select { padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); outline: none; }
.duty-table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.duty-table th {
  background: linear-gradient(135deg, var(--primary-lighter), var(--accent-light));
  padding: 12px 8px; font-size: 13px; font-weight: 700; text-align: center;
  border-bottom: 2px solid var(--border);
}
.duty-table th:first-child { width: 90px; }
.duty-table td {
  padding: 10px 8px; text-align: center; border-bottom: 1px solid var(--border);
  font-size: 12.5px; min-height: 50px; vertical-align: middle;
}
.duty-table tr:last-child td { border-bottom: none; }
.duty-table td:hover { background: var(--bg-warm); }
.duty-cell { cursor: pointer; transition: var(--transition); min-height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.duty-cell .duty-name { padding: 2px 8px; border-radius: 10px; background: var(--accent-light); font-size: 11.5px; }
.duty-cell .duty-empty { color: var(--text-lighter); font-size: 12px; }
.duty-time-label { font-weight: 600; color: var(--text-light); font-size: 12.5px; }

/* ===== 成绩分析 ===== */
.score-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 20px; }
.score-stat-card {
  background: var(--card); border-radius: var(--radius); padding: 16px; text-align: center;
  box-shadow: var(--shadow); border-top: 3px solid var(--primary);
}
.score-stat-card .value { font-size: 26px; font-weight: 900; font-family: 'Noto Serif SC', serif; color: var(--primary); }
.score-stat-card .label { font-size: 12px; color: var(--text-light); margin-top: 4px; }
.charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.chart-container { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.chart-container h4 { font-size: 14px; margin-bottom: 12px; }
.chart-box { width: 100%; height: 280px; }
.rank-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.rank-table th {
  background: var(--bg-warm); padding: 10px 12px; text-align: left; font-size: 12.5px;
  font-weight: 700; color: var(--text-light); border-bottom: 2px solid var(--border);
}
.rank-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
.rank-table tr:last-child td { border-bottom: none; }
.rank-table tr:hover { background: var(--bg-warm); }
.rank-badge {
  display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px;
  border-radius: 50%; font-size: 12px; font-weight: 700; background: var(--bg-warm); color: var(--text-light);
}
.rank-badge.top1 { background: linear-gradient(135deg, #F5D76E, #E8B84B); color: #fff; }
.rank-badge.top2 { background: linear-gradient(135deg, #C0C0C0, #A0A0A0); color: #fff; }
.rank-badge.top3 { background: linear-gradient(135deg, #D4A574, #B8895A); color: #fff; }
.score-input { width: 70px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; text-align: center; font-size: 13px; }
.score-input:focus { outline: none; border-color: var(--primary); }

/* ===== 花名册 ===== */
.roster-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.view-toggle { display: flex; background: var(--bg-warm); border-radius: var(--radius-sm); padding: 3px; }
.view-toggle-btn {
  padding: 6px 14px; border-radius: 6px; font-size: 12.5px; color: var(--text-light);
  transition: var(--transition); display: flex; align-items: center; gap: 5px;
}
.view-toggle-btn.active { background: var(--card); color: var(--primary); box-shadow: var(--shadow); font-weight: 600; }
.view-toggle-btn svg { width: 14px; height: 14px; }

.roster-table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.roster-table th {
  background: var(--bg-warm); padding: 11px 12px; text-align: left; font-size: 12.5px;
  font-weight: 700; color: var(--text-light); border-bottom: 2px solid var(--border); white-space: nowrap;
}
.roster-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
.roster-table tr:last-child td { border-bottom: none; }
.roster-table tr:hover { background: var(--bg-warm); }
.student-avatar {
  width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff; margin-right: 8px; vertical-align: middle;
}
.group-tag {
  display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600;
}
.action-btns { display: flex; gap: 6px; }
.action-btn {
  width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
  transition: var(--transition); color: var(--text-light);
}
.action-btn:hover { background: var(--primary-lighter); color: var(--primary); }

// 智能命令解析器
function parseSmartCommand(input) {
  input = input.trim();
  if (!input) return null;

  // 匹配学生姓名
  let matchedStudent = null;
  let matchedIndex = -1;
  for (const s of appData.students) {
    const idx = input.indexOf(s.name);
    if (idx !== -1 && (matchedIndex === -1 || idx < matchedIndex)) {
      matchedStudent = s;
      matchedIndex = idx;
    }
  }

  // 匹配动作关键词
  const leaveKeywords = ['请假', '病假', '事假', '公假', '休假', '不在', '没来'];
  const disciplineKeywords = {
    '旷课': '旷课', '缺课': '旷课', '逃学': '旷课',
    '迟到': '迟到早退', '早退': '迟到早退',
    '吸烟': '吸烟', '抽烟': '吸烟',
    '喝酒': '喝酒', '饮酒': '喝酒',
    '打架': '打架斗殴', '斗殴': '打架斗殴',
    '玩手机': '上课玩手机', '手机': '上课玩手机',
    '未交作业': '未交作业', '没交作业': '未交作业',
    '顶撞': '顶撞老师',
    '宿舍违纪': '宿舍违纪',
    '作弊': '考试作弊',
    '夜不归宿': '夜不归宿',
  };

  let action = null;
  let actionType = null;
  let actionDetail = '';

  // 检查请假关键词
  for (const kw of leaveKeywords) {
    if (input.includes(kw)) {
      action = '请假';
      actionType = 'leave';
      if (kw === '病假') actionDetail = '病假';
      else if (kw === '事假') actionDetail = '事假';
      else if (kw === '公假') actionDetail = '公假';
      else actionDetail = '其他';
      break;
    }
  }

  // 检查违纪关键词
  if (!action) {
    for (const [kw, detail] of Object.entries(disciplineKeywords)) {
      if (input.includes(kw)) {
        action = '违纪';
        actionType = 'discipline';
        actionDetail = detail;
        break;
      }
    }
  }

  if (matchedStudent && actionType) {
    return {
      student: matchedStudent,
      action: action,
      actionType: actionType,
      actionDetail: actionDetail,
      fullText: matchedStudent.name + action + (actionDetail ? '（' + actionDetail + '）' : '')
    };
  }

  // 只匹配到学生，没有动作
  if (matchedStudent) {
    return { student: matchedStudent, action: null, actionType: null, actionDetail: '', fullText: matchedStudent.name };
  }

  return null;
}

// 执行智能命令
function executeSmartCommand(result) {
  if (!result || !result.student) {
    showToast('未识别到学生姓名，请输入如"张三请假"', 'warning');
    return;
  }

  if (result.actionType === 'leave') {
    // 打开请假登记并预填
    openDisciplineManager('leave');
    setTimeout(() => {
      const searchInput = document.getElementById('leaveStudentSearch');
      const hiddenInput = document.getElementById('leaveStudent');
      const reasonSelect = document.getElementById('leaveReason');
      if (searchInput) {
        searchInput.value = result.student.name;
        // 触发下拉选择
        const dropdown = document.getElementById('leaveStudentDropdown');
        if (dropdown) {
          dropdown.innerHTML = '<div class="student-search-item selected" data-id="' + result.student.id + '" data-name="' + result.student.name + '"><span>' + result.student.name + '（第' + result.student.group + '组）</span><span class="pinyin">' + getPinyinInitials(result.student.name) + '</span></div>';
          dropdown.classList.add('show');
          // 自动点击选中
          setTimeout(() => {
            const item = dropdown.querySelector('.student-search-item');
            if (item) item.click();
          }, 100);
        }
      }
      if (hiddenInput) hiddenInput.value = result.student.id;
      if (reasonSelect && result.actionDetail) {
        for (const opt of reasonSelect.options) {
          if (opt.value === result.actionDetail) {
            reasonSelect.value = result.actionDetail;
            break;
          }
        }
      }
      showToast('已自动填写：' + result.fullText + '，请选择日期后确认');
    }, 200);
  } else if (result.actionType === 'discipline') {
    // 打开违纪记录并预填
    openDisciplineManager('discipline');
    setTimeout(() => {
      const searchInput = document.getElementById('disStudentSearch');
      const hiddenInput = document.getElementById('disStudent');
      const contentSelect = document.getElementById('disContent');
      if (searchInput) {
        searchInput.value = result.student.name;
        const dropdown = document.getElementById('disStudentDropdown');
        if (dropdown) {
          dropdown.innerHTML = '<div class="student-search-item selected" data-id="' + result.student.id + '" data-name="' + result.student.name + '"><span>' + result.student.name + '（第' + result.student.group + '组）</span><span class="pinyin">' + getPinyinInitials(result.student.name) + '</span></div>';
          dropdown.classList.add('show');
          setTimeout(() => {
            const item = dropdown.querySelector('.student-search-item');
            if (item) item.click();
          }, 100);
        }
      }
      if (hiddenInput) hiddenInput.value = result.student.id;
      if (contentSelect && result.actionDetail) {
        for (const opt of contentSelect.options) {
          if (opt.value === result.actionDetail) {
            contentSelect.value = result.actionDetail;
            break;
          }
        }
      }
      showToast('已自动填写：' + result.fullText + '，请确认后保存');
    }, 200);
  } else {
    // 只匹配到学生，显示学生信息
    showToast('已找到：' + result.student.name + '（第' + result.student.group + '组），请补充动作如"请假/旷课"');
  }
}

// 智能输入框初始化
function initSmartCommand() {
  const input = document.getElementById('smartCommandInput');
  const suggestions = document.getElementById('smartSuggestions');
  if (!input || !suggestions) return;

  function updateSuggestions() {
    const val = input.value.trim();
    if (!val) {
      suggestions.classList.remove('show');
      return;
    }
    const result = parseSmartCommand(val);
    if (result && result.student && result.actionType) {
      const tagClass = result.actionType === 'leave' ? 'leave' : 'discipline';
      suggestions.innerHTML = '<div class="smart-suggestion-item" data-action="execute"><span>' + result.fullText + '</span><span class="action-tag ' + tagClass + '">' + result.action + '</span></div>';
    } else if (result && result.student) {
      suggestions.innerHTML = '<div class="smart-suggestion-item"><span>' + result.student.name + '（第' + result.student.group + '组）</span><span class="action-tag">补充动作</span></div>';
    } else {
      // 显示匹配的学生列表
      const pinyinVal = val.toUpperCase();
      const matched = appData.students.filter(s =>
        s.name.includes(val) || getPinyinInitials(s.name).includes(pinyinVal)
      ).slice(0, 5);
      if (matched.length > 0) {
        suggestions.innerHTML = matched.map(s =>
          '<div class="smart-suggestion-item" data-student="' + s.name + '"><span>' + s.name + '（第' + s.group + '组）</span><span class="action-tag">选择学生</span></div>'
        ).join('');
      } else {
        suggestions.innerHTML = '<div class="student-search-empty">未找到匹配，试试输入"张三请假"</div>';
      }
    }
    suggestions.classList.add('show');
  }

  input.addEventListener('input', updateSuggestions);
  input.addEventListener('focus', updateSuggestions);

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const result = parseSmartCommand(input.value);
      if (result && result.actionType) {
        executeSmartCommand(result);
        suggestions.classList.remove('show');
        input.value = '';
      }
    }
  });

  suggestions.addEventListener('click', (e) => {
    const item = e.target.closest('.smart-suggestion-item');
    if (!item) return;
    if (item.dataset.action === 'execute') {
      const result = parseSmartCommand(input.value);
      if (result) executeSmartCommand(result);
      suggestions.classList.remove('show');
      input.value = '';
    } else if (item.dataset.student) {
      input.value = item.dataset.student;
      updateSuggestions();
    }
  });

  document.addEventListener('click', (e) => {
    if (!input.contains(e.target) && !suggestions.contains(e.target)) {
      suggestions.classList.remove('show');
    }
  });
}

function getPinyinInitials(name) {
  let result = '';
  for (let i = 0; i < name.length; i++) {
    const ch = name[i];
    result += PINYIN_INITIALS[ch] || ch;
  }
  return result.toUpperCase();
}

function randomName(gender) {
  const surname = SURNAMES[Math.floor(Math.random() * SURNAMES.length)];
  const given = gender === '男' ? GIVEN_M[Math.floor(Math.random() * GIVEN_M.length)] : GIVEN_F[Math.floor(Math.random() * GIVEN_F.length)];
  return surname + given;
}

function generateStudents() {
  
  const students = [];
  let id = 1;
  // 10个小组：前2组7人，后8组6人 = 62人
  // groupSizes 已在全局定义
  for (let g = 1; g <= 10; g++) {
    const size = groupSizes[g - 1];
    for (let i = 0; i < size; i++) {
      const data = REAL_STUDENTS[id - 1] || {name:'学生'+id, phone:'', address:'', parentName:'', parentPhone:'', relation:'家长'};
      students.push({
        id: id,
        studentNo: '26SC3' + String(id).padStart(3, '0'),
        name: data.name,
        gender: '男',
        group: g,
        phone: data.phone,
        idCard: '4113' + String(2008 + Math.floor(Math.random() * 2)) + String(Math.floor(Math.random()*12)+1).padStart(2,'0') + String(Math.floor(Math.random()*28)+1).padStart(2,'0') + String(Math.floor(1000 + Math.random()*8999)),
        address: data.address,
        parentName: data.parentName,
        parentPhone: data.parentPhone,
        relation: data.relation,
        seat: null
      });
      id++;
    }
  }
  // 分配座位：8列×8行 = 64座位，按顺序分配62人
  let seatIdx = 0;
  for (let row = 1; row <= 8; row++) {
    for (let col = 1; col <= 8; col++) {
      if (seatIdx < students.length) {
        students[seatIdx].seat = { row: row, col: col };
        seatIdx++;
      }
    }
  }
  return students;
}

function generateScores() {
  const subjects = ['语文','数学','英语','专业理论','专业实操'];
  const scores = {};
  for (let i = 1; i <= 61; i++) {
    scores[i] = {};
    subjects.forEach(s => {
      scores[i][s] = Math.floor(50 + Math.random() * 50);
    });
  }
  return scores;
}

function generateDuty() {
  // 20周值日表，每周5天×5时段
  const duty = {};
  const timeSlots = ['早读','上午','中午','下午','晚自习'];
  for (let week = 1; week <= 20; week++) {
    duty[week] = {};
    for (let day = 0; day < 5; day++) {
      duty[week][day] = {};
      timeSlots.forEach(slot => {
        // 随机安排1-2名学生
        const count = Math.random() > 0.5 ? 2 : 1;
        const ids = [];
        for (let c = 0; c < count; c++) {
          ids.push(Math.floor(Math.random() * 61) + 1);
        }
        duty[week][day][slot] = ids;
      });
    }
  }
  return duty;
}

function generateSchedule() {
  const courses = ['语文','数学','英语','体育','专业理论','专业实操','班会','自习','德育','心理健康','安全教育','就业指导'];
  const locations = ['教室101','教室102','实训车间','微机室','操场','图书馆','多媒体室'];
  const schedule = { odd: {}, even: {} };
  for (let day = 0; day < 5; day++) {
    schedule.odd[day] = [];
    schedule.even[day] = [];
    for (let period = 0; period < 9; period++) {
      const course = courses[Math.floor(Math.random() * courses.length)];
      const loc = locations[Math.floor(Math.random() * locations.length)];
      schedule.odd[day].push({ name: course, location: loc });
      // 双周大部分相同，少数不同
      if (Math.random() > 0.7) {
        schedule.even[day].push({ name: courses[Math.floor(Math.random() * courses.length)], location: locations[Math.floor(Math.random() * locations.length)] });
      } else {
        schedule.even[day].push({ name: course, location: loc });
      }
    }
  }
  return schedule;
}

function getDefaultData() {

    committee: generateCommittee(),
    schedule: generateSchedule(),
    currentWeek: 1,

  };
}

// 数据存储
let appData = null;
function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      appData = JSON.parse(saved);
      return;
    }
  } catch(e) { console.warn('读取本地数据失败', e); }
  appData = getDefaultData();
  saveData();
}
function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
  } catch(e) { console.warn('保存数据失败', e); }
}

  // ========== 数据导出/导入/迁移功能 ==========

  function exportData() {
    const data = {
      exportTime: new Date().toISOString(),
      version: '1.0',
      students: appData.students,
      leaveRecords: appData.leaveRecords,
      disciplineRecords: appData.disciplineRecords,
      scores: appData.scores,
      duty: appData.duty,
      schedule: appData.schedule,
      growthData: appData.growthData,
      committee: appData.committee,
      currentWeek: appData.currentWeek,
      weekType: appData.weekType,
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = '班主任工作台数据备份_' + dateStr + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('数据已导出备份', 'success');
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = JSON.parse(e.target.result);

        if (!confirm('确定要导入备份数据吗？\n\n导入后将覆盖当前所有数据，建议先导出当前数据备份。')) {
          event.target.value = '';
          return;
        }

        // 学生ID迁移：按姓名匹配
        const oldStudents = data.students || [];
        const newStudents = appData.students;
        const nameToNewId = {};
        for (const s of newStudents) nameToNewId[s.name] = s.id;
        const oldIdToNewId = {};
        for (const oldS of oldStudents) {
          if (nameToNewId[oldS.name]) oldIdToNewId[oldS.id] = nameToNewId[oldS.name];
        }

        // 迁移请假记录
        if (data.leaveRecords) {
          appData.leaveRecords = data.leaveRecords.map(r => {
            if (oldIdToNewId[r.studentId]) return {...r, studentId: oldIdToNewId[r.studentId]};
            return r;
          });
        }

        // 迁移违纪记录
        if (data.disciplineRecords) {
          appData.disciplineRecords = data.disciplineRecords.map(r => {
            if (oldIdToNewId[r.studentId]) return {...r, studentId: oldIdToNewId[r.studentId]};
            return r;
          });
        }

        // 迁移成绩
        if (data.scores) {
          const newScores = {};
          for (const oldId in data.scores) {
            const newId = oldIdToNewId[parseInt(oldId)];
            if (newId) newScores[newId] = data.scores[oldId];
          }
          appData.scores = newScores;
        }

        // 迁移值日
        if (data.duty) {
          const newDuty = {};
          for (const week in data.duty) {
            newDuty[week] = {};
            for (const day in data.duty[week]) {
              newDuty[week][day] = {};
              for (const slot in data.duty[week][day]) {
                const ids = data.duty[week][day][slot] || [];
                newDuty[week][day][slot] = ids.map(id => oldIdToNewId[id] || id).filter(id => newStudents.find(s => s.id === id));
              }
            }
          }
          appData.duty = newDuty;
        }

        // 迁移成长数据
        if (data.growthData) {
          const newGrowth = {};
          for (const oldId in data.growthData) {
            const newId = oldIdToNewId[parseInt(oldId)];
            if (newId) newGrowth[newId] = data.growthData[oldId];
          }
          appData.growthData = newGrowth;
        }

        // 迁移班委
        if (data.committee) {
          for (const type in data.committee) {
            if (Array.isArray(data.committee[type])) {
              data.committee[type] = data.committee[type].map(item => {
                if (item.person && oldIdToNewId[item.person]) return {...item, person: oldIdToNewId[item.person]};
                return item;
              });
            }
          }
          appData.committee = data.committee;
        }

        if (data.currentWeek) appData.currentWeek = data.currentWeek;
        if (data.weekType) appData.weekType = data.weekType;

        saveData();
        showToast('数据导入成功，学生ID已自动迁移', 'success');

        const currentPage = document.querySelector('.nav-item.active')?.dataset.page || 'dashboard';
        navigate(currentPage);

      } catch (err) {
        alert('导入失败：文件格式不正确\n\n' + err.message);
      }
      event.target.value = '';
    };
    reader.readAsText(file);
  }

  function switchClass(classId) {

      document.getElementById('classSelector').value = currentClassId;
      return;
    }

    // 保存当前数据
    saveData();

    // 切换班级
    currentClassId = classId;
    currentClass = CLASSES[classId];
    REAL_STUDENTS = currentClass.students;
    GROWTH_DATA = currentClass.growthData;
    STORAGE_KEY = currentClass.storageKey;
    groupSizes = currentClass.groupSizes;

    // 保存当前班级选择

    loadData();

    navigate(currentPage);

  function showAddClassDialog() {
    const className = prompt('请输入新班级名称（例如：26级数车1班）：');
    if (!className || !className.trim()) return;

    const classId = 'custom_' + Date.now();
    const storageKey = 'nyjs_headteacher_' + classId + '_v1';

    // 创建新班级（使用空模板）
    CLASSES[classId] = {
      id: classId,
      name: className.trim(),
      shortName: className.trim().replace('26级', '').replace('班', ''),
      storageKey: storageKey,
      groupSizes: [6,6,6,6,6,6,6,6,6,6],
      studentIdPrefix: '26CUSTOM',
      students: [],
      growthData: {}
    };

    // 添加到下拉框
    const selector = document.getElementById('classSelector');
    const option = document.createElement('option');
    option.value = classId;
    option.textContent = className.trim();
    selector.insertBefore(option, selector.querySelector('option[value="__add__"]'));

    // 保存班级列表到localStorage
    saveCustomClasses();

    // 切换到新班级
    switchClass(classId);

    showToast('已创建新班级「' + className.trim() + '」，请在花名册中添加学生', 'success');
  }

  function saveCustomClasses() {
    // 保存自定义班级到localStorage
    const customClasses = {};
    for (const id in CLASSES) {
      if (id.startsWith('custom_')) {
        customClasses[id] = CLASSES[id];
      }
    }
    localStorage.setItem('nyjs_custom_classes', JSON.stringify(customClasses));
  }

  function loadCustomClasses() {
    // 从localStorage加载自定义班级
    try {
      const saved = localStorage.getItem('nyjs_custom_classes');
      if (saved) {
        const customClasses = JSON.parse(saved);
        for (const id in customClasses) {
          CLASSES[id] = customClasses[id];
        }
        // 添加到下拉框
        const selector = document.getElementById('classSelector');
        for (const id in customClasses) {
          if (!selector.querySelector('option[value="' + id + '"]')) {
            const option = document.createElement('option');
            option.value = id;
            option.textContent = customClasses[id].name;
            selector.insertBefore(option, selector.querySelector('option[value="__add__"]'));
          }
        }
      }
    } catch (e) {
      console.error('加载自定义班级失败', e);
    }
  }

  // ========== 班级切换功能结束 ==========

function resetData() {
  appData = getDefaultData();
  saveData();
}

// 工具函数
function getStudentById(id) {
  return appData.students.find(s => s.id === id);
}
function getStudentName(id) {
  const s = getStudentById(id);
  return s ? s.name : '未知';
}
function avatarColor(name) {
  const colors = ['#D4786B','#E8A838','#7BA05B','#5B8AB0','#8A6BB0','#B06B8A','#6BB0A0','#B09A6B'];
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return colors[Math.abs(hash) % colors.length];
}

function showToast(msg, type = 'success') {
  const container = document.getElementById('toastContainer');

  toast.className = 'toast' + (type !== 'success' ? ' ' + type : '');
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => {

    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

// 学生成长模块
function renderGrowth(container) {
  let html = '';
  html += '<div class="growth-search-bar">';
  html += '<input type="text" id="growthSearch" placeholder="搜索学生姓名、爱好、家庭情况...">';
  html += '<select id="growthGroupFilter"><option value="">全部小组</option>';
  for (let g = 1; g <= 10; g++) {
    html += '<option value="' + g + '">第' + g + '组</option>';
  }
  html += '</select>';
  html += '<select id="growthTagFilter"><option value="">全部标签</option><option value="singleParent">单亲家庭</option><option value="orphan">孤儿家庭</option><option value="reconstructed">重组家庭</option><option value="hobby">有兴趣爱好</option><option value="health">健康关注</option><option value="difficult">困难群体</option></select>';
  html += '</div>';
  html += '<div class="growth-list" id="growthList"></div>';

  container.innerHTML = html;

  function renderList() {
    const keyword = document.getElementById('growthSearch').value.toLowerCase();
    const groupFilter = document.getElementById('growthGroupFilter').value;
    const tagFilter = document.getElementById('growthTagFilter').value;
    const list = document.getElementById('growthList');

    let filtered = appData.students.filter(s => {
      const growth = appData.growthData[s.id] || {};
      if (groupFilter && String(s.group) !== groupFilter) return false;
      if (keyword) {
        const searchText = (s.name + (growth.hobbies||'') + (growth.familySpecial||'') + (growth.biggestWorry||'') + (growth.secretWord||'')).toLowerCase();
        if (!searchText.includes(keyword) && !getPinyinInitials(s.name).toLowerCase().includes(keyword)) return false;
      }
      if (tagFilter === 'hobby' && !growth.hobbies) return false;
      if (tagFilter === 'family' && (!growth.familySpecial || growth.familySpecial === '否')) return false;
      if (tagFilter === 'health' && (!growth.healthAllow || growth.healthAllow === '允许')) return false;
      if (tagFilter === 'difficult' && (!growth.familyDifficult || growth.familyDifficult === '否')) return false;
      return true;
    });

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty-state" style="padding:40px;text-align:center;"><p style="color:var(--text-lighter);">未找到匹配的学生</p></div>';
      return;
    }

    list.innerHTML = filtered.map(s => {
      const g = appData.growthData[s.id] || {};
      const tags = [];
      // 家庭特殊情况重点标记
      if (g.familySpecial) {
        const fs = g.familySpecial;
        if (fs.includes('孤儿') || fs.includes('去世') || fs.includes('双亡')) {
          tags.push('<span class="growth-tag orphan">孤儿家庭</span>');
        } else if (fs.includes('单亲')) {
          tags.push('<span class="growth-tag single-parent">单亲家庭</span>');
        } else if (fs.includes('重组') || fs.includes('再婚') || fs.includes('继')) {
          tags.push('<span class="growth-tag reconstructed">重组家庭</span>');
        } else if (fs !== '否' && !fs.includes('无') && !fs.includes('正常') && !fs.includes('和谐') && !fs.includes('完整')) {
          tags.push('<span class="growth-tag family">家庭关注</span>');
        }
      }
      if (g.hobbies) tags.push('<span class="growth-tag hobby">' + g.hobbies.substring(0,8) + '</span>');
      if (g.healthAllow && g.healthAllow !== '允许') tags.push('<span class="growth-tag health">健康关注</span>');
      if (g.familyDifficult && g.familyDifficult !== '否') tags.push('<span class="growth-tag family">困难群体</span>');
      return '<div class="growth-card" data-id="' + s.id + '">' +
        '<div class="growth-card-header">' +
        '<div class="growth-avatar" style="background:' + avatarColor(s.name) + ';">' + s.name.charAt(0) + '</div>' +
        '<div><div class="growth-card-name">' + s.name + '</div>' +
        '<div class="growth-card-meta">第' + s.group + '组 · ' + (s.gender||'') + '</div></div></div>' +
        '<div class="growth-card-tags">' + tags.join('') + '</div>' +
        '</div>';
    }).join('');

    list.querySelectorAll('.growth-card').forEach(card => {
      card.addEventListener('click', () => openGrowthDetail(parseInt(card.dataset.id)));
    });
  }

  document.getElementById('growthSearch').addEventListener('input', renderList);
  document.getElementById('growthGroupFilter').addEventListener('change', renderList);
  document.getElementById('growthTagFilter').addEventListener('change', renderList);
  renderList();
}

  html += item('最担忧/最希望帮助的事', g.biggestWorry, true);

  if (!ROUTES[route]) route = 'dashboard';

  document.querySelectorAll('.nav-item').forEach(item => {
    item.classList.toggle('active', item.dataset.route === route);
  });
  document.getElementById('pageTitle').textContent = ROUTES[route].title;
  const content = document.getElementById('content');
  content.innerHTML = '<div class="view active" id="view-' + route + '"></div>';
  ROUTES[route].render(document.getElementById('view-' + route));
  // 平板端关闭侧边栏
  if (window.innerWidth <= 1024) {
    document.getElementById('sidebar').classList.remove('mobile-open');
    document.getElementById('sidebarOverlay').classList.remove('show');

}

  document.getElementById('addLeaveForm').style.display = 'block';
}
function hideAddLeaveForm() {
  document.getElementById('addLeaveForm').style.display = 'none';
}

function submitLeave() {
  const studentId = parseInt(document.getElementById('leaveStudent').value);
  const reason = document.getElementById('leaveReason').value.trim();
  const startDate = document.getElementById('leaveStart').value;
  const endDate = document.getElementById('leaveEnd').value;

  if (!studentId) { showToast('请选择学生'); return; }
  if (!reason) { showToast('请填写请假事由'); return; }
  if (!startDate || !endDate) { showToast('请选择日期'); return; }
  if (endDate < startDate) { showToast('截止日期不能早于开始日期'); return; }

  const newId = appData.leaveRecords.length > 0 ? Math.max(...appData.leaveRecords.map(r => r.id)) + 1 : 1;
  appData.leaveRecords.push({
    id: newId, studentId, reason, startDate, endDate, status: 'active'
  });
  saveData();
  closeModal();
  showToast('请假登记成功');
  openLeaveManager();
}

function returnLeave(id) {
  const record = appData.leaveRecords.find(r => r.id === id);
  if (record) {
    record.status = 'returned';
    record.returnDate = new Date().toISOString().split('T')[0];
    saveData();
    showToast('已销假');
    closeModal();
    openLeaveManager();
  }
}

function initStudentSearch(inputId, dropdownId, hiddenId, students) {
  const input = document.getElementById(inputId);
  const dropdown = document.getElementById(dropdownId);
  const hidden = document.getElementById(hiddenId);
  if (!input || !dropdown || !hidden) return;

  function renderDropdown(keyword) {
    keyword = (keyword || '').trim().toUpperCase();
    let filtered = students;
    if (keyword) {
      filtered = students.filter(s => {
        const nameMatch = s.name.toUpperCase().includes(keyword);
        const pinyin = getPinyinInitials(s.name);
        const pinyinMatch = pinyin.includes(keyword);
        return nameMatch || pinyinMatch;
      });
    }
    if (filtered.length === 0) {
      dropdown.innerHTML = '<div class="student-search-empty">未找到匹配的学生</div>';
    } else {
      dropdown.innerHTML = filtered.map(s => {
        const pinyin = getPinyinInitials(s.name);
        const selected = hidden.value == s.id ? 'selected' : '';
        return '<div class="student-search-item ' + selected + '" data-id="' + s.id + '" data-name="' + s.name + '"><span>' + s.name + '（第' + s.group + '组）</span><span class="pinyin">' + pinyin + '</span></div>';
      }).join('');
    }
    dropdown.classList.add('show');

    // 绑定点击事件
    dropdown.querySelectorAll('.student-search-item').forEach(item => {
      item.addEventListener('click', () => {
        hidden.value = item.dataset.id;
        input.value = item.dataset.name;
        dropdown.classList.remove('show');
      });
    });
  }

  input.addEventListener('focus', () => renderDropdown(input.value));
  input.addEventListener('input', () => {
    hidden.value = '';
    renderDropdown(input.value);
  });

  // 点击外部关闭
  document.addEventListener('click', (e) => {
    if (!input.contains(e.target) && !dropdown.contains(e.target)) {
      dropdown.classList.remove('show');
    }
  });
}

  const newId = appData.disciplineRecords.length > 0 ? Math.max(...appData.disciplineRecords.map(r => r.id)) + 1 : 1;
  appData.disciplineRecords.push({ id: newId, studentId, content, date });
  saveData();
  closeModal();
  showToast('违纪记录已保存');
  openDisciplineManager();
}

function deleteDiscipline(id) {
  appData.disciplineRecords = appData.disciplineRecords.filter(r => r.id !== id);
  saveData();
  closeModal();
  openDisciplineManager();
  showToast('记录已删除');
}

/* ================================================================
   视图2：座次表
================================================================ */
let seatHighlightGroup = null;
let seatSearchText = '';

function renderSeats(container) {
  let html = '';
  // 工具栏
  html += '<div class="seat-toolbar">';
  html += '<div class="search-box">';
  html += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
  html += '<input type="text" id="seatSearch" placeholder="搜索学生姓名...">';
  html += '</div>';
  html += '<div class="group-filters" id="groupFilters">';
  html += '<button class="group-filter-btn active" data-group="0">全部</button>';
  for (let g = 1; g <= 10; g++) {
    html += '<button class="group-filter-btn" data-group="' + g + '">第' + g + '组</button>';
  }
  html += '</div>';
  html += '</div>';

  // 教室
  html += '<div class="classroom">';
  html += '<div class="teacher-desk">讲 台</div>';
  html += '<div class="seat-grid" id="seatGrid">';
  // 8列×8行 = 64座位，62名学生
  for (let row = 1; row <= 8; row++) {
    for (let col = 1; col <= 8; col++) {
      const student = appData.students.find(s => s.seat && s.seat.row === row && s.seat.col === col);
      if (student) {
        html += '<div class="seat occupied" draggable="true" data-student-id="' + student.id + '" data-row="' + row + '" data-col="' + col + '">';
        html += '<span class="seat-group g' + student.group + '">' + student.group + '</span>';
        html += '<span class="seat-name">' + student.name + '</span>';
        html += '</div>';
      } else {
        html += '<div class="seat empty" data-row="' + row + '" data-col="' + col + '">';
        html += '<span style="color:var(--text-lighter);font-size:11px;">空座</span>';
        html += '</div>';
      }
    }
  }
  html += '</div></div>';
  html += '<p style="text-align:center;margin-top:14px;font-size:12px;color:var(--text-light);">提示：拖拽学生可交换座位，点击座位可编辑分配</p>';

  container.innerHTML = html;

  // 搜索
  const searchInput = document.getElementById('seatSearch');
  searchInput.addEventListener('input', function() {
    seatSearchText = this.value.trim();
    applySeatHighlight();
  });

  // 小组筛选
  document.querySelectorAll('.group-filter-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.group-filter-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      seatHighlightGroup = parseInt(this.dataset.group) || null;
      applySeatHighlight();
    });
  });

  // 拖拽
  let draggedStudentId = null;
  container.querySelectorAll('.seat.occupied').forEach(seat => {
    seat.addEventListener('dragstart', function(e) {
      draggedStudentId = parseInt(this.dataset.studentId);
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    seat.addEventListener('dragend', function() {
      this.classList.remove('dragging');
      draggedStudentId = null;
      container.querySelectorAll('.seat').forEach(s => s.classList.remove('drag-over'));
    });
    seat.addEventListener('click', function() {
      const sid = parseInt(this.dataset.studentId);
      openSeatEdit(sid);
    });
  });

  container.querySelectorAll('.seat').forEach(seat => {
    seat.addEventListener('dragover', function(e) {
      e.preventDefault();
      this.classList.add('drag-over');
    });
    seat.addEventListener('dragleave', function() {
      this.classList.remove('drag-over');
    });
    seat.addEventListener('drop', function(e) {
      e.preventDefault();
      this.classList.remove('drag-over');
      if (!draggedStudentId) return;
      const targetRow = parseInt(this.dataset.row);
      const targetCol = parseInt(this.dataset.col);
      const targetStudent = appData.students.find(s => s.seat && s.seat.row === targetRow && s.seat.col === targetCol);
      const draggedStudent = getStudentById(draggedStudentId);
      if (draggedStudent && draggedStudent.seat) {
        const oldRow = draggedStudent.seat.row;
        const oldCol = draggedStudent.seat.col;
        if (targetStudent) {
          targetStudent.seat = { row: oldRow, col: oldCol };
        }
        draggedStudent.seat = { row: targetRow, col: targetCol };
        saveData();
        showToast('座位已调整');
        renderSeats(container);
      }
    });
  });

  // 空座点击
  container.querySelectorAll('.seat.empty').forEach(seat => {
    seat.addEventListener('click', function() {
      const row = parseInt(this.dataset.row);
      const col = parseInt(this.dataset.col);
      openSeatAssign(row, col);
    });
  });
}

function applySeatHighlight() {
  document.querySelectorAll('.seat.occupied').forEach(seat => {
    const sid = parseInt(seat.dataset.studentId);
    const student = getStudentById(sid);
    let highlight = false;
    if (seatHighlightGroup && student && student.group === seatHighlightGroup) highlight = true;
    if (seatSearchText && student && student.name.indexOf(seatSearchText) !== -1) highlight = true;
    seat.classList.toggle('highlight', highlight);
  });
}

function openSeatEdit(studentId) {
  const student = getStudentById(studentId);
  if (!student) return;
  const unassigned = appData.students.filter(s => !s.seat);
  let options = '<option value="' + student.id + '" selected>' + student.name + '（当前）</option>';
  unassigned.forEach(s => {
    options += '<option value="' + s.id + '">' + s.name + '</option>';
  });
  openModal('编辑座位',
    '<div class="form-group"><label class="form-label">当前座位</label><div style="padding:8px 12px;background:var(--bg-warm);border-radius:8px;font-size:13px;">第' + student.seat.row + '排 第' + student.seat.col + '列 · ' + student.name + '（第' + student.group + '组）</div></div>' +
    '<div class="form-group"><label class="form-label">更换为其他学生</label><select class="form-select" id="seatChangeSelect">' + options + '</select></div>' +
    '<div class="form-group"><label class="form-label">或清空此座位</label><button class="btn btn-danger btn-sm" id="clearSeatBtn">清空座位</button></div>',
    '<button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" id="saveSeatBtn">保存</button>',
    () => {
      document.getElementById('saveSeatBtn').addEventListener('click', () => {
        const newId = parseInt(document.getElementById('seatChangeSelect').value);
        if (newId !== studentId) {
          const newStudent = getStudentById(newId);
          const oldSeat = { ...student.seat };
          student.seat = null;
          if (newStudent) newStudent.seat = oldSeat;
        }
        saveData();
        closeModal();
        showToast('座位已更新');
        renderSeats(document.getElementById('view-seats'));
      });
      document.getElementById('clearSeatBtn').addEventListener('click', () => {
        student.seat = null;
        saveData();
        closeModal();
        showToast('座位已清空');
        renderSeats(document.getElementById('view-seats'));
      });
    }
  );
}

function openSeatAssign(row, col) {
  const unassigned = appData.students.filter(s => !s.seat);
  if (unassigned.length === 0) {
    showToast('没有未分配座位的学生', 'warning');
    return;
  }
  let options = '';
  unassigned.forEach(s => {
    options += '<option value="' + s.id + '">' + s.name + '（第' + s.group + '组）</option>';
  });
  openModal('分配座位',
    '<div class="form-group"><label class="form-label">座位位置</label><div style="padding:8px 12px;background:var(--bg-warm);border-radius:8px;font-size:13px;">第' + row + '排 第' + col + '列</div></div>' +
    '<div class="form-group"><label class="form-label">选择学生</label><select class="form-select" id="assignSelect">' + options + '</select></div>',
    '<button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" id="confirmAssignBtn">确认分配</button>',
    () => {
      document.getElementById('confirmAssignBtn').addEventListener('click', () => {
        const sid = parseInt(document.getElementById('assignSelect').value);
        const student = getStudentById(sid);
        if (student) {
          student.seat = { row: row, col: col };
          saveData();
          closeModal();
          showToast('座位已分配');
          renderSeats(document.getElementById('view-seats'));
        }
      });
    }
  );
}

   视图3：值日表

const DUTY_SLOTS = ['早读','上午','中午','下午','晚自习'];

function renderDuty(container) {

  html += '<select id="dutyWeekSelect">';

    html += '<option value="' + w + '"' + (w === appData.currentWeek ? ' selected' : '') + '>第' + w + '周</option>';
  }

  DUTY_SLOTS.forEach(slot => {

      html += '<td><div class="duty-cell" data-day="' + day + '" data-slot="' + slot + '">';
      if (ids.length > 0) {
        ids.forEach(id => {

        });

      }
      html += '</div></td>';
    }

  html += '</tbody></table>';
  html += '<p style="text-align:center;margin-top:14px;font-size:12px;color:var(--text-light);">点击单元格可编辑值日安排，支持批量复制到下周</p>';

  container.innerHTML = html;

  // 周次切换
  document.getElementById('dutyWeekSelect').addEventListener('change', function() {

  // 复制到下周
  document.getElementById('copyWeekBtn').addEventListener('click', () => {
    const nextWeek = appData.currentWeek + 1;
    if (nextWeek > 20) {
      showToast('已是最后一周，无法复制', 'warning');
      return;
    }
    appData.duty[nextWeek] = JSON.parse(JSON.stringify(appData.duty[appData.currentWeek]));
    saveData();
    showToast('已复制到第' + nextWeek + '周');
  });

  // 清空本周
  document.getElementById('clearWeekBtn').addEventListener('click', () => {
    openModal('清空本周值日',
      '<p>确定要清空第' + appData.currentWeek + '周的所有值日安排吗？</p>',
      '<button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-danger" id="confirmClearDuty">确认清空</button>',
      () => {
        document.getElementById('confirmClearDuty').addEventListener('click', () => {
          appData.duty[appData.currentWeek] = {};
          for (let d = 0; d < 5; d++) {
            appData.duty[appData.currentWeek][d] = {};
            DUTY_SLOTS.forEach(s => appData.duty[appData.currentWeek][d][s] = []);
          }
          saveData();
          closeModal();
          showToast('已清空本周值日');
          renderDuty(container);
        });
      }
    );
  });

  // 单元格点击编辑
  container.querySelectorAll('.duty-cell').forEach(cell => {
    cell.addEventListener('click', () => {
      const day = parseInt(cell.dataset.day);
      const slot = cell.dataset.slot;
      openDutyEdit(day, slot, container);
    });
  });
}

function openDutyEdit(day, slot, container) {
  const weekData = appData.duty[appData.currentWeek] || {};
  const currentIds = (weekData[day] && weekData[day][slot]) ? weekData[day][slot] : [];

  let studentOptions = '';
  appData.students.forEach(s => {
    const selected = currentIds.includes(s.id) ? ' selected' : '';
    studentOptions += '<option value="' + s.id + '"' + selected + '>' + s.name + '（第' + s.group + '组）</option>';
  });

  openModal('编辑值日 - ' + DUTY_DAYS[day] + ' ' + slot,
    '<div class="form-group"><label class="form-label">选择值日学生（可多选，按住Ctrl/Cmd）</label><select class="form-select" id="dutyStudentSelect" multiple size="8" style="height:auto;">' + studentOptions + '</select></div>' +
    '<p style="font-size:12px;color:var(--text-light);">当前已选：' + (currentIds.length > 0 ? currentIds.map(id => getStudentName(id)).join('、') : '无') + '</p>',
    '<button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" id="saveDutyBtn">保存</button>',
    () => {
      document.getElementById('saveDutyBtn').addEventListener('click', () => {
        const select = document.getElementById('dutyStudentSelect');
        const ids = Array.from(select.selectedOptions).map(o => parseInt(o.value));
        if (!appData.duty[appData.currentWeek]) appData.duty[appData.currentWeek] = {};
        if (!appData.duty[appData.currentWeek][day]) appData.duty[appData.currentWeek][day] = {};
        appData.duty[appData.currentWeek][day][slot] = ids;
        saveData();
        closeModal();
        showToast('值日安排已保存');
        renderDuty(container);
      });
    }
  );
}

/* ================================================================
   视图4：成绩分析
================================================================ */
const SUBJECTS = ['语文','数学','英语','专业理论','专业实操'];
let scoreChartInstances = [];

function renderScores(container) {
  // 计算统计数据
  const allScores = [];
  const subjectSums = {};
  const subjectMax = {};
  const subjectMin = {};
  SUBJECTS.forEach(s => { subjectSums[s] = 0; subjectMax[s] = 0; subjectMin[s] = 100; });

  let totalSum = 0;
  let totalMax = 0;
  let totalMin = 500;
  let passCount = 0;
  let excellentCount = 0;

  appData.students.forEach(student => {
    const scores = appData.scores[student.id] || {};
    let total = 0;
    let hasAll = true;
    SUBJECTS.forEach(s => {
      const v = scores[s] || 0;
      total += v;
      subjectSums[s] += v;
      if (v > subjectMax[s]) subjectMax[s] = v;
      if (v < subjectMin[s]) subjectMin[s] = v;
      if (v === 0) hasAll = false;
    });
    allScores.push({ id: student.id, name: student.name, group: student.group, total: total, scores: scores });
    totalSum += total;
    if (total > totalMax) totalMax = total;
    if (total < totalMin) totalMin = total;
    const avg = total / SUBJECTS.length;
    if (avg >= 60) passCount++;
    if (avg >= 85) excellentCount++;
  });

  const avgTotal = (totalSum / appData.students.length).toFixed(1);
  const avgScore = (totalSum / appData.students.length / SUBJECTS.length).toFixed(1);
  const passRate = ((passCount / appData.students.length) * 100).toFixed(1);
  const excellentRate = ((excellentCount / appData.students.length) * 100).toFixed(1);

  // 等级分布
  const grades = { '优秀(≥85)': 0, '良好(75-84)': 0, '中等(65-74)': 0, '及格(60-64)': 0, '不及格(<60)': 0 };
  allScores.forEach(s => {
    const avg = s.total / SUBJECTS.length;
    if (avg >= 85) grades['优秀(≥85)']++;
    else if (avg >= 75) grades['良好(75-84)']++;
    else if (avg >= 65) grades['中等(65-74)']++;
    else if (avg >= 60) grades['及格(60-64)']++;
    else grades['不及格(<60)']++;
  });

  // 排名
  const ranked = [...allScores].sort((a, b) => b.total - a.total);

  let html = '';
  // 指标卡
  html += '<div class="score-stats">';
  html += '<div class="score-stat-card"><div class="value">' + avgScore + '</div><div class="label">平均分数</div></div>';
  html += '<div class="score-stat-card" style="border-top-color:var(--success)"><div class="value" style="color:var(--success)">' + passRate + '%</div><div class="label">及格率</div></div>';
  html += '<div class="score-stat-card" style="border-top-color:var(--accent)"><div class="value" style="color:#9A7B2E">' + excellentRate + '%</div><div class="label">优秀率</div></div>';
  html += '<div class="score-stat-card" style="border-top-color:var(--warning)"><div class="value" style="color:var(--warning)">' + totalMax + '</div><div class="label">最高分</div></div>';
  html += '<div class="score-stat-card" style="border-top-color:var(--danger)"><div class="value" style="color:var(--danger)">' + totalMin + '</div><div class="label">最低分</div></div>';
  html += '</div>';

  // 图表
  html += '<div class="charts-row">';
  html += '<div class="chart-container"><h4>各科平均分对比</h4><div class="chart-box" id="barChart"></div></div>';
  html += '<div class="chart-container"><h4>成绩等级分布</h4><div class="chart-box" id="pieChart"></div></div>';
  html += '</div>';

  // 排名表
  html += '<div class="card" style="margin-top:20px;">';
  html += '<div class="card-header"><div class="card-title">成绩排名 <span class="tag">共' + ranked.length + '人</span></div>';
  html += '<button class="btn btn-primary btn-sm" id="batchEditScoresBtn">批量录入成绩</button></div>';
  html += '<div style="overflow-x:auto;"><table class="rank-table"><thead><tr><th>排名</th><th>姓名</th><th>小组</th>';
  SUBJECTS.forEach(s => html += '<th>' + s + '</th>');
  html += '<th>总分</th><th>操作</th></tr></thead><tbody>';

  ranked.forEach((s, idx) => {
    const rankClass = idx === 0 ? 'top1' : idx === 1 ? 'top2' : idx === 2 ? 'top3' : '';
    html += '<tr>';
    html += '<td><span class="rank-badge ' + rankClass + '">' + (idx + 1) + '</span></td>';
    html += '<td><strong>' + s.name + '</strong></td>';
    html += '<td><span class="group-tag g' + s.group + '">第' + s.group + '组</span></td>';
    SUBJECTS.forEach(sub => {
      html += '<td><input type="number" class="score-input" value="' + (s.scores[sub] || 0) + '" min="0" max="100" data-student="' + s.id + '" data-subject="' + sub + '"></td>';
    });
    html += '<td><strong style="color:var(--primary)">' + s.total + '</strong></td>';
    html += '<td><button class="btn btn-outline btn-sm save-score-btn" data-student="' + s.id + '">保存</button></td>';
    html += '</tr>';
  });
  html += '</tbody></table></div></div>';

  container.innerHTML = html;

  // 渲染柱状图
  const barChart = echarts.init(document.getElementById('barChart'));
  barChart.setOption({
    tooltip: { trigger: 'axis' },
    grid: { left: '8%', right: '5%', bottom: '10%', top: '10%' },
    xAxis: { type: 'category', data: SUBJECTS, axisLabel: { color: '#8B7E74', fontSize: 12 } },
    yAxis: { type: 'value', min: 0, max: 100, axisLabel: { color: '#8B7E74', fontSize: 12 }, splitLine: { lineStyle: { color: '#EDE0D4' } } },
    series: [{
      type: 'bar',
      data: SUBJECTS.map(s => parseFloat((subjectSums[s] / appData.students.length).toFixed(1))),
      itemStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: '#E8A598' }, { offset: 1, color: '#D4786B' }]), borderRadius: [6, 6, 0, 0] },
      barWidth: '45%',
      label: { show: true, position: 'top', color: '#4A3F35', fontSize: 12, fontWeight: 'bold' }
    }]
  });

  // 渲染饼图
  const pieChart = echarts.init(document.getElementById('pieChart'));
  const pieColors = ['#7BA05B', '#5B8AB0', '#E8C87A', '#E8A838', '#C75B5B'];
  pieChart.setOption({
    tooltip: { trigger: 'item', formatter: '{b}: {c}人 ({d}%)' },
    legend: { type: 'scroll', bottom: 0, textStyle: { color: '#8B7E74', fontSize: 11 } },
    series: [{
      type: 'pie',
      radius: ['40%', '65%'],
      center: ['50%', '45%'],
      avoidLabelOverlap: true,
      itemStyle: { borderRadius: 6, borderColor: '#fff', borderWidth: 2 },
      label: { show: true, formatter: (params) => params.name + '\n' + params.value + '人', fontSize: 11, color: '#4A3F35' },
      data: Object.keys(grades).map((k, i) => ({ value: grades[k], name: k, itemStyle: { color: pieColors[i] } }))
    }]
  });

  new ResizeObserver(() => { barChart.resize(); pieChart.resize(); }).observe(container);

  // 单行保存
  container.querySelectorAll('.save-score-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const sid = parseInt(this.dataset.student);
      const row = this.closest('tr');
      row.querySelectorAll('.score-input').forEach(input => {
        const sub = input.dataset.subject;
        const val = parseInt(input.value) || 0;
        if (!appData.scores[sid]) appData.scores[sid] = {};
        appData.scores[sid][sub] = Math.min(100, Math.max(0, val));
      });
      saveData();
      showToast('成绩已保存');
      renderScores(container);
    });
  });

  // 批量录入
  document.getElementById('batchEditScoresBtn').addEventListener('click', () => {
    let formHtml = '<div class="form-group"><label class="form-label">选择学生</label><select class="form-select" id="batchStudentSelect">';
    appData.students.forEach(s => {
      formHtml += '<option value="' + s.id + '">' + s.name + '（第' + s.group + '组）</option>';
    });
    formHtml += '</select></div>';
    SUBJECTS.forEach(s => {
      formHtml += '<div class="form-group"><label class="form-label">' + s + '</label><input type="number" class="form-input batch-score" data-subject="' + s + '" min="0" max="100" placeholder="0-100"></div>';
    });
    openModal('录入成绩', formHtml,
      '<button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" id="confirmBatchScoreBtn">保存成绩</button>',
      () => {
        document.getElementById('confirmBatchScoreBtn').addEventListener('click', () => {
          const sid = parseInt(document.getElementById('batchStudentSelect').value);
          if (!appData.scores[sid]) appData.scores[sid] = {};
          document.querySelectorAll('.batch-score').forEach(input => {
            const sub = input.dataset.subject;
            const val = parseInt(input.value) || 0;
            appData.scores[sid][sub] = Math.min(100, Math.max(0, val));
          });
          saveData();
          closeModal();
          showToast('成绩已录入');
          renderScores(container);
        });
      }
    );
  });
}

  html += '<button class="view-toggle-btn" data-mode="card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>卡片</button>';
  html += '</div>';
  html += '<button class="btn btn-primary btn-sm" id="addStudentBtn">+ 添加学生</button>';
  html += '</div>';

  // 筛选
  let filtered = appData.students.filter(s => {
    if (rosterSearchText && s.name.indexOf(rosterSearchText) === -1 && s.studentNo.indexOf(rosterSearchText) === -1) return false;
    if (rosterFilterGroup && s.group !== rosterFilterGroup) return false;
    if (rosterFilterGender && s.gender !== rosterFilterGender) return false;
    return true;
  });

  html += '<div style="margin-bottom:12px;font-size:12.5px;color:var(--text-light);">共 ' + filtered.length + ' 名学生</div>';

    filtered.forEach(s => {
      html += '<tr>';
      html += '<td style="font-size:12px;color:var(--text-light);">' + s.studentNo + '</td>';
      html += '<td><span class="student-avatar" style="background:' + avatarColor(s.name) + '">' + s.name.charAt(0) + '</span><strong>' + s.name + '</strong></td>';
      html += '<td>' + s.gender + '</td>';
      html += '<td><span class="group-tag g' + s.group + '">第' + s.group + '组</span></td>';
      html += '<td style="font-size:12.5px;">' + s.phone + '</td>';
      html += '<td>' + s.parentName + '</td>';
      html += '<td style="font-size:12.5px;">' + s.parentPhone + '</td>';
      html += '<td><div class="action-btns"><button class="action-btn edit-student" data-id="' + s.id + '" title="编辑"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>';
      html += '<button class="action-btn delete delete-student" data-id="' + s.id + '" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div></td>';
      html += '</tr>';
    });
