      html += '<div class="student-card">';
      html += '<div class="student-card-header">';
      html += '<span class="student-avatar" style="background:' + avatarColor(s.name) + ';width:40px;height:40px;font-size:16px;">' + s.name.charAt(0) + '</span>';
      html += '<div><div style="font-weight:700;font-size:15px;">' + s.name + '</div><div style="font-size:11px;color:var(--text-light);">' + s.studentNo + '</div></div>';
      html += '<span class="group-tag g' + s.group + '" style="margin-left:auto;">第' + s.group + '组</span>';
      html += '</div>';
      html += '<div class="student-card-info">';
      html += '<p><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>' + s.gender + '生</p>';
      html += '<p><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>' + s.phone + '</p>';
      html += '<p><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' + s.address + '</p>';
      html += '<p><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>' + s.parentName + '（' + s.relation + '）· ' + s.parentPhone + '</p>';
      html += '</div>';
      html += '<div style="margin-top:12px;display:flex;gap:8px;">';
      html += '<button class="btn btn-outline btn-sm edit-student" data-id="' + s.id + '">编辑</button>';
      html += '<button class="btn btn-danger btn-sm delete-student" data-id="' + s.id + '">删除</button>';
      html += '</div></div>';
    });
    html += '</div>';
  }

  if (filtered.length === 0) {
    html += '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><p>没有找到匹配的学生</p></div>';
  }

  container.innerHTML = html;

  // 搜索
  document.getElementById('rosterSearch').addEventListener('input', function() {
    rosterSearchText = this.value.trim();
    renderRoster(container);
  });
  document.getElementById('rosterGroupFilter').addEventListener('change', function() {
    rosterFilterGroup = parseInt(this.value) || 0;
    renderRoster(container);
  });
  document.getElementById('rosterGenderFilter').addEventListener('change', function() {
    rosterFilterGender = this.value;
    renderRoster(container);
  });

  // 视图切换
  container.querySelectorAll('.view-toggle-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      container.querySelectorAll('.view-toggle-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      rosterViewMode = this.dataset.mode;
      renderRoster(container);
    });
  });

  // 添加学生
  document.getElementById('addStudentBtn').addEventListener('click', () => openStudentEdit(null, container));

  // 编辑/删除
  container.querySelectorAll('.edit-student').forEach(btn => {
    btn.addEventListener('click', function() {
      openStudentEdit(parseInt(this.dataset.id), container);
    });
  });
  container.querySelectorAll('.delete-student').forEach(btn => {
    btn.addEventListener('click', function() {
      const sid = parseInt(this.dataset.id);
      const student = getStudentById(sid);
      openModal('删除学生',
        '<p>确定要删除学生 <strong>' + student.name + '</strong> 吗？</p><p style="color:var(--text-light);font-size:12.5px;margin-top:8px;">删除后该学生的成绩、座次、值日等信息也将被移除，且不可恢复。</p>',
        '<button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-danger" id="confirmDeleteStudent">确认删除</button>',
        () => {
          document.getElementById('confirmDeleteStudent').addEventListener('click', () => {
            appData.students = appData.students.filter(s => s.id !== sid);
            delete appData.scores[sid];
            // 清理值日
            Object.keys(appData.duty).forEach(w => {
              Object.keys(appData.duty[w]).forEach(d => {
                Object.keys(appData.duty[w][d]).forEach(slot => {
                  appData.duty[w][d][slot] = appData.duty[w][d][slot].filter(id => id !== sid);
                });
              });
            });
            saveData();
            closeModal();
            showToast('学生已删除');
            renderRoster(container);
          });
        }
      );
    });
  });
}

function openStudentEdit(studentId, container) {
  const isEdit = studentId !== null;
  const student = isEdit ? getStudentById(studentId) : { name: '', gender: '男', group: 1, phone: '', idCard: '', address: '', parentName: '', parentPhone: '', relation: '父亲' };

  let groupOptions = '';
  for (let g = 1; g <= 10; g++) groupOptions += '<option value="' + g + '"' + (student.group === g ? ' selected' : '') + '>第' + g + '组</option>';

  openModal(isEdit ? '编辑学生信息' : '添加学生',
    '<div class="form-row">' +
    '<div class="form-group"><label class="form-label">姓名 *</label><input class="form-input" id="editName" value="' + student.name + '" placeholder="请输入姓名"></div>' +
    '<div class="form-group"><label class="form-label">性别</label><select class="form-select" id="editGender"><option value="男"' + (student.gender === '男' ? ' selected' : '') + '>男</option><option value="女"' + (student.gender === '女' ? ' selected' : '') + '>女</option></select></div>' +
    '</div>' +
    '<div class="form-row">' +
    '<div class="form-group"><label class="form-label">小组</label><select class="form-select" id="editGroup">' + groupOptions + '</select></div>' +
    '<div class="form-group"><label class="form-label">联系电话</label><input class="form-input" id="editPhone" value="' + student.phone + '" placeholder="学生手机号"></div>' +
    '</div>' +
    '<div class="form-group"><label class="form-label">身份证号</label><input class="form-input" id="editIdCard" value="' + student.idCard + '" placeholder="身份证号"></div>' +
    '<div class="form-group"><label class="form-label">家庭住址</label><input class="form-input" id="editAddress" value="' + student.address + '" placeholder="家庭住址"></div>' +
    '<div class="form-row">' +
    '<div class="form-group"><label class="form-label">家长姓名</label><input class="form-input" id="editParentName" value="' + student.parentName + '" placeholder="家长姓名"></div>' +
    '<div class="form-group"><label class="form-label">关系</label><select class="form-select" id="editRelation"><option value="父亲"' + (student.relation === '父亲' ? ' selected' : '') + '>父亲</option><option value="母亲"' + (student.relation === '母亲' ? ' selected' : '') + '>母亲</option><option value="爷爷"' + (student.relation === '爷爷' ? ' selected' : '') + '>爷爷</option><option value="奶奶"' + (student.relation === '奶奶' ? ' selected' : '') + '>奶奶</option><option value="其他"' + (student.relation === '其他' ? ' selected' : '') + '>其他</option></select></div>' +
    '</div>' +
    '<div class="form-group"><label class="form-label">家长电话</label><input class="form-input" id="editParentPhone" value="' + student.parentPhone + '" placeholder="家长联系电话"></div>',
    '<button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" id="saveStudentBtn">保存</button>',
    () => {
      document.getElementById('saveStudentBtn').addEventListener('click', () => {
        const name = document.getElementById('editName').value.trim();
        if (!name) { showToast('请输入学生姓名', 'warning'); return; }
        const data = {
          name: name,
          gender: document.getElementById('editGender').value,
          group: parseInt(document.getElementById('editGroup').value),
          phone: document.getElementById('editPhone').value.trim(),
          idCard: document.getElementById('editIdCard').value.trim(),
          address: document.getElementById('editAddress').value.trim(),
          parentName: document.getElementById('editParentName').value.trim(),
          parentPhone: document.getElementById('editParentPhone').value.trim(),
          relation: document.getElementById('editRelation').value
        };
        if (isEdit) {
          Object.assign(student, data);
        } else {
          const newId = Math.max(...appData.students.map(s => s.id)) + 1;
          appData.students.push({
            id: newId,
            studentNo: '26SC3' + String(newId).padStart(3, '0'),
            seat: null,
            ...data
          });
          if (!appData.scores[newId]) {
            appData.scores[newId] = {};
            SUBJECTS.forEach(s => appData.scores[newId][s] = 0);
          }
        }
        saveData();
        closeModal();
        showToast(isEdit ? '学生信息已更新' : '学生已添加');
        renderRoster(container);
      });
    }
  );
}

    html += '<button class="btn btn-outline btn-sm edit-parent" data-id="' + s.id + '">编辑</button>';
    html += '<a href="tel:' + s.parentPhone + '" class="btn btn-accent btn-sm" style="text-decoration:none;">拨打电话</a>';
    html += '</div></div>';
  });
  html += '</div>';

  if (filtered.length === 0) {
    html += '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><p>没有找到匹配的联系人</p></div>';

  document.getElementById('addParentBtn').addEventListener('click', () => {
    showToast('请在花名册中添加学生后自动生成家长信息', 'warning');

  container.querySelectorAll('.edit-parent').forEach(btn => {
    btn.addEventListener('click', function() {
      const sid = parseInt(this.dataset.id);
      const s = getStudentById(sid);

        '</div>' +
        '<div class="form-group"><label class="form-label">家长电话</label><input class="form-input" id="editParentPhone2" value="' + s.parentPhone + '"></div>' +
        '<div class="form-group"><label class="form-label">家庭住址</label><input class="form-input" id="editAddress2" value="' + s.address + '"></div>',
        '<button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" id="saveParentBtn">保存</button>',
        () => {
          document.getElementById('saveParentBtn').addEventListener('click', () => {
            s.parentName = document.getElementById('editParentName2').value.trim();
            s.relation = document.getElementById('editRelation2').value;
            s.parentPhone = document.getElementById('editParentPhone2').value.trim();
            s.address = document.getElementById('editAddress2').value.trim();
            saveData();
            closeModal();
            showToast('家长信息已更新');
            renderParents(container);
          });
        }
      );

/* ================================================================
   视图8：课程表
================================================================ */
const PERIOD_TIMES = ['08:00-08:45','08:55-09:40','10:00-10:45','10:55-11:40','14:30-15:15','15:25-16:10','16:30-17:15','17:25-18:10','19:00-20:30'];
const SCHEDULE_DAYS = ['周一','周二','周三','周四','周五'];

function renderSchedule(container) {
  let html = '';
  html += '<div class="schedule-toolbar">';
  html += '<div class="week-type-toggle">';
  html += '<button class="week-type-btn' + (appData.weekType === 'odd' ? ' active' : '') + '" data-type="odd">单周</button>';
  html += '<button class="week-type-btn' + (appData.weekType === 'even' ? ' active' : '') + '" data-type="even">双周</button>';
  html += '</div>';
  html += '<div style="display:flex;gap:8px;">';
  html += '<button class="btn btn-accent btn-sm" id="copyScheduleBtn">复制单周到双周</button>';
  html += '</div>';
  html += '</div>';

  html += '<div style="overflow-x:auto;"><table class="schedule-table"><thead><tr><th>节次</th>';
  SCHEDULE_DAYS.forEach(d => html += '<th>' + d + '</th>');
  html += '</tr></thead><tbody>';

  const sched = appData.schedule[appData.weekType];
  for (let period = 0; period < 9; period++) {
    html += '<tr>';
    html += '<td><span class="period-num">第' + (period + 1) + '节</span><span class="period-time">' + PERIOD_TIMES[period] + '</span></td>';
    for (let day = 0; day < 5; day++) {
      const course = sched[day] && sched[day][period] ? sched[day][period] : null;
      html += '<td><div class="course-cell" data-day="' + day + '" data-period="' + period + '">';
      if (course && course.name) {
        html += '<span class="course-name">' + course.name + '</span>';
        if (course.location) html += '<span class="course-location">' + course.location + '</span>';
      } else {
        html += '<span class="course-empty">点击安排</span>';
      }
      html += '</div></td>';
    }
    html += '</tr>';
  }
  html += '</tbody></table></div>';
  html += '<p style="text-align:center;margin-top:14px;font-size:12px;color:var(--text-light);">点击单元格可编辑课程，支持单双周切换与批量复制</p>';

  container.innerHTML = html;

  // 单双周切换
  container.querySelectorAll('.week-type-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      container.querySelectorAll('.week-type-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      appData.weekType = this.dataset.type;
      saveData();
      renderSchedule(container);
    });
  });

  // 复制单周到双周
  document.getElementById('copyScheduleBtn').addEventListener('click', () => {
    openModal('复制课程表',
      '<p>确定要将单周课程表复制到双周吗？</p><p style="color:var(--text-light);font-size:12.5px;margin-top:8px;">此操作将覆盖双周的所有课程安排。</p>',
      '<button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" id="confirmCopySchedule">确认复制</button>',
      () => {
        document.getElementById('confirmCopySchedule').addEventListener('click', () => {
          appData.schedule.even = JSON.parse(JSON.stringify(appData.schedule.odd));
          saveData();
          closeModal();
          showToast('已复制单周课程到双周');
          appData.weekType = 'even';
          renderSchedule(container);
        });
      }
    );
  });

  // 单元格编辑
  container.querySelectorAll('.course-cell').forEach(cell => {
    cell.addEventListener('click', function() {
      const day = parseInt(this.dataset.day);
      const period = parseInt(this.dataset.period);
      openCourseEdit(day, period, container);
    });
  });
}

function openCourseEdit(day, period, container) {
  const course = appData.schedule[appData.weekType][day][period] || { name: '', location: '' };
  const courseList = ['语文','数学','英语','体育','专业理论','专业实操','班会','自习','德育','心理健康','安全教育','就业指导','物理','化学','历史'];
  const locationList = ['教室101','教室102','教室103','实训车间','微机室','操场','图书馆','多媒体室','实验室'];

  let courseOptions = '<option value="">-- 选择课程 --</option>';
  courseList.forEach(c => courseOptions += '<option value="' + c + '"' + (course.name === c ? ' selected' : '') + '>' + c + '</option>');
  let locOptions = '<option value="">-- 选择地点 --</option>';
  locationList.forEach(l => locOptions += '<option value="' + l + '"' + (course.location === l ? ' selected' : '') + '>' + l + '</option>');

  openModal('编辑课程 - ' + SCHEDULE_DAYS[day] + ' 第' + (period + 1) + '节',
    '<div class="form-group"><label class="form-label">课程名称</label><select class="form-select" id="editCourseName">' + courseOptions + '</select></div>' +
    '<div class="form-group"><label class="form-label">或自定义课程名</label><input class="form-input" id="editCourseCustom" placeholder="自定义课程名称（可选）" value="' + (courseList.includes(course.name) ? '' : course.name) + '"></div>' +
    '<div class="form-group"><label class="form-label">上课地点</label><select class="form-select" id="editCourseLoc">' + locOptions + '</select></div>',
    '<button class="btn btn-danger btn-sm" id="clearCourseBtn" style="margin-right:auto;">清空课程</button><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" id="saveCourseBtn">保存</button>',
    () => {
      document.getElementById('saveCourseBtn').addEventListener('click', () => {
        const custom = document.getElementById('editCourseCustom').value.trim();
        const selected = document.getElementById('editCourseName').value;
        const name = custom || selected;
        const location = document.getElementById('editCourseLoc').value;
        appData.schedule[appData.weekType][day][period] = { name: name, location: location };
        saveData();
        closeModal();
        showToast('课程已保存');
        renderSchedule(container);
      });
      document.getElementById('clearCourseBtn').addEventListener('click', () => {
        appData.schedule[appData.weekType][day][period] = { name: '', location: '' };
        saveData();
        closeModal();
        showToast('课程已清空');
        renderSchedule(container);
      });
    }
  );
}
