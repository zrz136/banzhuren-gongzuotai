<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5E6D3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8D5C4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 书本/班级图标 -->
  <g transform="translate(128, 120)">
    <!-- 书本底部 -->
    <rect x="20" y="180" width="216" height="24" rx="4" fill="#C4A882" opacity="0.6"/>
    <!-- 左页 -->
    <path d="M20 40 L128 60 L128 200 L20 180 Z" fill="#FFF9F0" stroke="#D4B896" stroke-width="3"/>
    <!-- 右页 -->
    <path d="M128 60 L236 40 L236 180 L128 200 Z" fill="#FFF9F0" stroke="#D4B896" stroke-width="3"/>
    <!-- 中缝 -->
    <line x1="128" y1="60" x2="128" y2="200" stroke="#D4B896" stroke-width="3"/>
    <!-- 文字线条 -->
    <line x1="45" y1="90" x2="110" y2="100" stroke="#C4A882" stroke-width="4" stroke-linecap="round"/>
    <line x1="45" y1="115" x2="110" y2="125" stroke="#C4A882" stroke-width="4" stroke-linecap="round"/>
    <line x1="45" y1="140" x2="95" y2="148" stroke="#C4A882" stroke-width="4" stroke-linecap="round"/>
    <line x1="146" y1="100" x2="211" y2="90" stroke="#C4A882" stroke-width="4" stroke-linecap="round"/>
    <line x1="146" y1="125" x2="211" y2="115" stroke="#C4A882" stroke-width="4" stroke-linecap="round"/>
    <line x1="146" y1="148" x2="196" y2="140" stroke="#C4A882" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- 班字 -->
  <text x="256" y="400" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="72" font-weight="bold" fill="#8B6F47" text-anchor="middle">班主任</text>
</svg>
